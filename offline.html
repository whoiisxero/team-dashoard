<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#050711">
  <meta name="robots" content="noindex,nofollow">
  <title>Quest · Offline</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:28px;background:radial-gradient(ellipse at top,#102343,transparent 65%),#050711;color:#e7f4ff;font:16px/1.7 system-ui,sans-serif}.card{width:min(100%,440px);border:1px solid #28efff77;background:#0b1020;padding:32px;border-radius:8px;box-shadow:0 0 32px #28efff15}.logo{width:64px;height:64px}.eyebrow{color:#75f8ff;letter-spacing:3px;text-transform:uppercase;font-size:12px;margin-top:24px}h1{font-size:29px;line-height:1.2}p{color:#a5b4cc}.button{display:inline-block;background:#28efff;color:#021017;border:0;border-radius:5px;font:700 15px system-ui;padding:14px 20px;text-decoration:none}.note{font-size:13px;margin-bottom:0}
  </style>
</head>
<body>
  <main class="card">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" aria-label="Quest"><rect x="1" y="1" width="62" height="62" rx="12" fill="#ff8b2b" stroke="#ffc278" stroke-width="2"/><g fill="none" stroke="#221006" stroke-width="7"><circle cx="30" cy="29" r="16"/><path d="M37 37L49 49"/></g></svg>
    <div class="eyebrow">Quest / Connection</div>
    <h1>You’re offline.</h1>
    <p>Reconnect to open your projects and conversations. Your team’s private data is available after Quest checks your access online.</p>
    <a class="button" href="/">Try again</a>
    <p class="note">If you were writing in another Quest tab, keep that tab open until you can send or save your changes.</p>
  </main>
</body>
</html>
