name: Quest checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  app-and-permissions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install playwright==1.62.0 pillow
          python -m playwright install --with-deps chromium
          npm install --prefix "$RUNNER_TEMP/quest-db" --no-save @electric-sql/pglite@0.3.14
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with Path(os.environ['GITHUB_ENV']).open('a') as f:
                  f.write('CHROMIUM_EXECUTABLE='+p.chromium.executable_path+'\n')
                  f.write('PGLITE_MODULE='+os.environ['RUNNER_TEMP']+'/quest-db/node_modules/@electric-sql/pglite/dist/index.js\n')
          PY
      - name: Build and test database permissions
        run: |
          node scripts/build.mjs
          node tests/member-access-db.mjs
          node tests/project-edit-access-db.mjs
          node tests/dusted-threads-db.mjs
          node tests/ngl-studio-db.mjs
          node tests/private-fragile-sharing-db.mjs
          node tests/personal-workspace-db.mjs
          node tests/personal-calendar-db.mjs
          node tests/private-quotes-db.mjs
          node tests/private-chats-db.mjs
          node tests/weed-diary-chat-db.mjs
          node tests/private-chat-files-db.mjs
          node tests/daily-workflow-db.mjs
          node tests/assistant-server.mjs
          node tests/assistant-tools-server.mjs
          node tests/research-server.mjs
          node tests/trading-access-server.mjs
          node scripts/build-research-preview.mjs
          node tests/research-build.mjs
      - name: Test browser workflows
        run: |
          python tests/session-startup-browser.py
          python tests/password-reset-browser.py
          python tests/member-access-browser.py
          python tests/project-edit-access-browser.py
          python tests/personal-workspace-browser.py
          python tests/personal-calendar-browser.py
          python tests/private-quotes-browser.py
          python tests/quest-preview-browser.py
          python tests/sidebar-sections-browser.py
          python tests/home-globe.py
          python tests/starfall-browser.py
          python tests/starfall-scores-browser.py
          python tests/connection-speed-browser.py
          python tests/loden-studio.py
          python tests/dusted-threads-browser.py
          python tests/ngl-studio-browser.py
          python tests/private-chats-browser.py
          python tests/direct-chat-browser.py
          python tests/weed-diary-browser.py
          python tests/weed-diary-chat-browser.py
          python tests/private-chat-files-browser.py
          python tests/studio-only-browser.py
          python tests/fragile-personal-browser.py
          python tests/private-fragile-sharing-browser.py
          python tests/calendar-edit.py
          python tests/notifications-browser.py
          python tests/daily-workflow-browser.py
          python tests/task-status-browser.py
          python tests/mobile-layout-browser.py
          python tests/trading-browser.py
          node scripts/build-quest-lab-demo.mjs "$RUNNER_TEMP/quest-lab/Quest-Lab-Demo.html"
          QUEST_LAB_OUTPUT="$RUNNER_TEMP/quest-lab" python tests/quest-lab-demo-browser.py
          python tests/assistant-browser.py
          python tests/assistant-tools-browser.py
          python tests/research-browser.py
          python tests/research-app-browser.py
          python tests/assistant-personality-browser.py
          python tests/installable-browser.py
  research-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research worker and test browser
        run: |
          python -m pip install -r worker/requirements.txt -c worker/constraints.txt playwright==1.62.0
          python -m playwright install --with-deps chromium
          python - <<'PY'
          import os
          from pathlib import Path
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              with Path(os.environ['GITHUB_ENV']).open('a') as f:
                  f.write('QUEST_BROWSER_EXECUTABLE='+p.chromium.executable_path+'\n')
          PY
      - name: Test authenticated queue, host startup and real browser adapter
        run: |
          python tests/test_research_worker.py
          python tests/test_research_hosting.py
          python tests/research-engine-smoke.py
      - name: Test the production container and supervised browser
        run: |
          docker build -f worker/Dockerfile -t quest-q-research:release .
          python tests/research-container-smoke.py
